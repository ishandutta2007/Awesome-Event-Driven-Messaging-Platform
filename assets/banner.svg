<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0D1527"/>
      <stop offset="100%" stop-color="#090E1A"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="streamGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Radial Glow Behind Text -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <style>
      @keyframes dashFlow {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes dashFlowReverse {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 200; }
      }
      @keyframes pulseGlow {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.15); opacity: 0.95; }
      }
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(8px) rotate(-1deg); }
      }
      @keyframes packetMove {
        0% { offset-distance: 0%; opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { offset-distance: 100%; opacity: 0; }
      }
      .stream-line-1 {
        stroke-dasharray: 12 12;
        animation: dashFlow 8s linear infinite;
      }
      .stream-line-2 {
        stroke-dasharray: 8 16;
        animation: dashFlowReverse 10s linear infinite;
      }
      .pulsing-node {
        transform-origin: center;
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .floating-pill-1 {
        animation: floatSlow1 6s ease-in-out infinite;
      }
      .floating-pill-2 {
        animation: floatSlow2 7s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)"/>

  <!-- Subtle Architectural Grid Pattern -->
  <g stroke="#1E293B" stroke-width="0.8" opacity="0.35">
    <line x1="100" y1="0" x2="100" y2="420"/>
    <line x1="250" y1="0" x2="250" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="420"/>
    <line x1="550" y1="0" x2="550" y2="420"/>
    <line x1="700" y1="0" x2="700" y2="420"/>
    <line x1="850" y1="0" x2="850" y2="420"/>
    <line x1="1000" y1="0" x2="1000" y2="420"/>
    <line x1="1150" y1="0" x2="1150" y2="420"/>
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
  </g>

  <!-- Ambient Ambient Glow Circle -->
  <circle cx="600" cy="210" r="380" fill="url(#centerGlow)"/>

  <!-- Dynamic Event Mesh Streaming Lines (Background Layer) -->
  <g fill="none">
    <!-- Top Flow Path -->
    <path d="M 40 80 C 260 20, 480 130, 720 70 S 1080 30, 1160 90" stroke="url(#streamGrad1)" stroke-width="2.5" class="stream-line-1"/>
    <!-- Middle Flow Waves -->
    <path d="M 30 340 C 250 390, 420 280, 680 350 S 1020 380, 1170 330" stroke="url(#streamGrad2)" stroke-width="2.5" class="stream-line-2"/>
    <!-- Outer Arc -->
    <path d="M 60 210 C 200 120, 320 100, 480 120" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.4" class="stream-line-1"/>
    <path d="M 720 300 C 880 320, 1000 300, 1140 210" stroke="#A855F7" stroke-width="1.5" stroke-opacity="0.4" class="stream-line-2"/>
  </g>

  <!-- Background Pulsing Network Broker Nodes -->
  <g class="pulsing-node">
    <circle cx="90" cy="110" r="14" fill="#0EA5E9" fill-opacity="0.25"/>
    <circle cx="90" cy="110" r="5" fill="#38BDF8"/>

    <circle cx="1110" cy="95" r="14" fill="#8B5CF6" fill-opacity="0.25"/>
    <circle cx="1110" cy="95" r="5" fill="#A78BFA"/>

    <circle cx="85" cy="315" r="14" fill="#EC4899" fill-opacity="0.25"/>
    <circle cx="85" cy="315" r="5" fill="#F472B6"/>

    <circle cx="1115" cy="325" r="14" fill="#10B981" fill-opacity="0.25"/>
    <circle cx="1115" cy="325" r="5" fill="#34D399"/>
  </g>

  <!-- Ambient Floating Tech Pills (Positioned at corners & edges, NOT obstructing foreground center) -->
  <g class="floating-pill-1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">
    <!-- Top-Left Pill: Kafka -->
    <g transform="translate(60, 42)">
      <rect width="105" height="30" rx="15" fill="#1E293B" fill-opacity="0.8" stroke="#38BDF8" stroke-width="1"/>
      <circle cx="18" cy="15" r="5" fill="#38BDF8"/>
      <text x="32" y="19" fill="#E2E8F0">Kafka</text>
    </g>

    <!-- Bottom-Left Pill: RabbitMQ -->
    <g transform="translate(70, 350)">
      <rect width="118" height="30" rx="15" fill="#1E293B" fill-opacity="0.8" stroke="#F97316" stroke-width="1"/>
      <circle cx="18" cy="15" r="5" fill="#F97316"/>
      <text x="32" y="19" fill="#E2E8F0">RabbitMQ</text>
    </g>

    <!-- Top-Right Pill: NATS JetStream -->
    <g transform="translate(1010, 45)">
      <rect width="128" height="30" rx="15" fill="#1E293B" fill-opacity="0.8" stroke="#22C55E" stroke-width="1"/>
      <circle cx="18" cy="15" r="5" fill="#22C55E"/>
      <text x="32" y="19" fill="#E2E8F0">NATS JetStream</text>
    </g>
  </g>

  <g class="floating-pill-2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">
    <!-- Bottom-Right Pill: Apache Pulsar -->
    <g transform="translate(1005, 345)">
      <rect width="135" height="30" rx="15" fill="#1E293B" fill-opacity="0.8" stroke="#A855F7" stroke-width="1"/>
      <circle cx="18" cy="15" r="5" fill="#A855F7"/>
      <text x="32" y="19" fill="#E2E8F0">Apache Pulsar</text>
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Backing Shield & Main Title Block (Always Prominent & Never Obscured) -->
  <g filter="url(#softShadow)">
    <!-- High-Contrast Glass Backdrop Card for Title -->
    <rect x="170" y="75" width="860" height="265" rx="20" fill="#0B1120" fill-opacity="0.85" stroke="#334155" stroke-width="1.2"/>
    <rect x="172" y="77" width="856" height="261" rx="18" fill="none" stroke="#60A5FA" stroke-width="0.8" stroke-opacity="0.25"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- Top Eyebrow Tag -->
    <g transform="translate(600, 116)">
      <rect x="-140" y="-14" width="280" height="26" rx="13" fill="#1E293B" stroke="#6366F1" stroke-width="1"/>
      <text x="0" y="4" font-size="11" font-weight="700" fill="#818CF8" letter-spacing="1.5">REAL-TIME ARCHITECTURE DIRECTORY</text>
    </g>

    <!-- Main Title (Gradient Fill + Crisp Foreground Stroke) -->
    <text x="600" y="174" font-size="37" font-weight="900" fill="url(#primaryGrad)" letter-spacing="-0.5" filter="url(#glow)">Awesome Event-Driven Messaging Platform</text>
    <text x="600" y="174" font-size="37" font-weight="900" fill="url(#primaryGrad)" letter-spacing="-0.5">Awesome Event-Driven Messaging Platform</text>

    <!-- Subtitle (Clear, readable, high contrast) -->
    <text x="600" y="214" font-size="16.5" font-weight="500" fill="#E2E8F0" letter-spacing="0.2">
      Curated Directory of Cloud Pub/Sub, Real-Time Event Streaming &amp; Open-Source Message Brokers
    </text>

    <!-- Bottom Feature Badges / Highlights -->
    <g transform="translate(600, 275)" font-size="12" font-weight="600">
      <!-- Badge 1: Pub/Sub & Queues -->
      <g transform="translate(-300, 0)">
        <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
        <text x="0" y="5" fill="#38BDF8">📡 Pub/Sub &amp; Queuing</text>
      </g>

      <!-- Badge 2: Low-Latency Streaming -->
      <g transform="translate(-95, 0)">
        <rect x="-95" y="-16" width="190" height="32" rx="16" fill="#0F172A" stroke="#818CF8" stroke-width="1.2"/>
        <text x="0" y="5" fill="#A5B4FC">⚡ Ultra-Low Latency</text>
      </g>

      <!-- Badge 3: Cloud & Open-Source -->
      <g transform="translate(105, 0)">
        <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#0F172A" stroke="#C084FC" stroke-width="1.2"/>
        <text x="0" y="5" fill="#E9D5FF">☁️ Managed &amp; Self-Hosted</text>
      </g>

      <!-- Badge 4: Production-Ready -->
      <g transform="translate(300, 0)">
        <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#0F172A" stroke="#34D399" stroke-width="1.2"/>
        <text x="0" y="5" fill="#6EE7B7">🚀 Enterprise Scale</text>
      </g>
    </g>
  </g>

  <!-- Border Accent Line -->
  <rect x="0" y="0" width="1200" height="420" rx="16" fill="none" stroke="#334155" stroke-width="1"/>
</svg>
